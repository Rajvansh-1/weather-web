<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>🌤️ My Weather</h1>

    <img id="weatherIcon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="weather">

    <h2 id="temperature">--°C</h2>
    <p id="description">Click below to get your weather</p>
    <p id="location">📍 Unknown</p>

    <button onclick="getLocation()">Get My Location</button>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
</div>

<script src="script.js"></script>
</body>
</html>
